name: Deploy Cloudflare backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - ".github/workflows/deploy-cloudflare-backend.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply pwn4g3-db --remote --config workers/telemetry/wrangler.jsonc

      - name: Deploy Workers
        run: |
          npx wrangler deploy --config workers/assets/wrangler.jsonc
          npx wrangler deploy --config workers/health/wrangler.jsonc
          npx wrangler deploy --config workers/components/wrangler.jsonc
          npx wrangler deploy --config workers/viper/wrangler.jsonc
          npx wrangler deploy --config workers/telemetry/wrangler.jsonc
          npx wrangler deploy --config workers/scheduler/wrangler.jsonc
          npx wrangler deploy --config workers/gateway/wrangler.jsonc
